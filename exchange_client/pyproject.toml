[build-system]
requires      = ["setuptools>=42.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name            = "exchange_client"
version         = "0.1.0"
description     = "Multi-exchange connector for crypto trading — Kraken and Binance"
requires-python = ">=3.8"
license         = { text = "MIT" }
dependencies    = [
    "pandas>=1.5.0,<3.0.0",
]

[project.optional-dependencies]
kraken  = ["krakenex>=2.1.0"]
binance = ["python-binance>=1.0.19"]
all     = ["krakenex>=2.1.0", "python-binance>=1.0.19"]
dev     = [
    "pytest>=7.0,<9.0",
    "pytest-mock>=3.0,<4.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]